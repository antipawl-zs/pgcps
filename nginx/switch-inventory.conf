server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /workspace/www;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
